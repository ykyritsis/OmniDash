<!doctype html><html lang="en"><meta charset="utf-8"><title>Xbox Preview UI — Beta 25</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#0b111c;color:#f4f6fa;font-family:'Segoe UI Variable Display','Segoe UI',sans-serif}body{width:1920px;height:1080px;overflow:hidden}.board{width:100%;height:100%;position:relative;overflow:hidden;background:linear-gradient(135deg,#111b2b,#080e16)}header{position:absolute;left:80px;right:80px;top:48px;display:flex;gap:24px;align-items:center}header img{width:92px;height:92px}h1{font-size:52px;letter-spacing:-1.8px;font-weight:600;line-height:1.15;margin:0}header p{font-size:25px;color:#aebacd;margin:11px 0 0}.beta{margin-left:auto;color:#8dbfeb;font-size:24px}.visual{position:absolute;left:224px;top:192px;width:1472px;border:1px solid #344459;border-radius:16px;overflow:hidden;box-shadow:0 24px 60px #0005}.visual img{display:block;width:100%;height:auto}.caption{position:absolute;left:80px;bottom:22px;color:#8c9aab;font-size:15px}.square{width:1080px;height:1080px}.square header{left:58px;right:58px;top:48px;gap:20px}.square header img{width:82px;height:82px}.square h1{font-size:43px;letter-spacing:-1.3px}.square header p{font-size:22px;margin-top:10px}.square .beta{font-size:19px}.square .visual{left:40px;top:275px;width:1000px;border:0;border-radius:8px;box-shadow:none}.square .caption{left:60px;bottom:42px;font-size:16px}.square .label{position:absolute;left:60px;top:190px;font-size:28px;font-weight:400;color:#d1dbe7}.social{width:1280px;height:640px}.social header{left:180px;right:180px;top:20px;gap:16px}.social header img{width:60px;height:60px}.social h1{font-size:33px;letter-spacing:-1px}.social header p{font-size:17px;margin-top:5px}.social .beta{font-size:17px}.social .visual{left:180px;top:104px;width:920px;border-radius:10px}.social .caption{display:none}.device .visual{left:224px;top:190px;width:1472px;border:0;border-radius:6px;box-shadow:none}.device .caption{bottom:24px}.wordmark{width:1500px;height:300px;background:transparent}.wordmark header{left:40px;top:50px;right:40px;gap:35px}.wordmark header img{width:200px;height:200px}.wordmark h1{font-size:99px;letter-spacing:-4px}.wordmark header p,.wordmark .beta,.wordmark .visual,.wordmark .caption{display:none}
.setup-pair{position:absolute;left:80px;right:80px;top:284px;display:grid;grid-template-columns:1fr 1fr;gap:32px}.setup-pair figure{margin:0}.setup-pair figcaption{font-size:28px;margin-bottom:20px;color:#c7d8ea}.setup-pair img{display:block;width:100%;border:1px solid #344459;border-radius:12px}.onboarding header p{color:#aebacd}
</style>
<main class="board" id="board"><header><img src="app-icon.svg" alt="Blue Xbox app icon"><div><h1>Xbox Preview UI</h1><p>A full-screen launcher for Windows.</p></div><span class="beta">Beta 25</span></header><div class="visual"><img src="screenshot-home.png" alt="Beta 25 home screen with a sample game library"></div><div class="caption">Beta 25 · Demo library</div></main>
<script>
const mode=location.hash.slice(1)||'hero',b=document.querySelector('#board');
const sizes={hero:[1920,1080],square:[1080,1080],social:[1280,640],ally:[1920,1080],laptop:[1920,1080],desktop:[1920,1080],libraries:[1920,1080],library:[1920,1080],game:[1920,1080],onboarding:[1920,1080],wordmark:[1500,300]};
document.body.style.width=sizes[mode][0]+'px';document.body.style.height=sizes[mode][1]+'px';b.classList.add(mode);
const names={ally:['mockup-rog-ally.png','ROG Ally'],laptop:['mockup-laptop.png','Laptop'],desktop:['mockup-desktop.png','Desktop'],libraries:['mockup-libraries.png','Setup and libraries'],library:['mockup-library.png','Game library'],game:['mockup-game-page.png','Game page']};
if(names[mode]){b.classList.add('device');document.querySelector('.visual img').src=names[mode][0];document.querySelector('.visual img').alt=names[mode][1]+' illustrative mockup';document.querySelector('.caption').textContent=names[mode][1]+' mockup · Demo library'}
if(['libraries','library','game'].includes(mode))document.querySelector('header p').textContent={libraries:'Connect your libraries.',library:'Browse your games.',game:'Game pages, trailers and launch options.'}[mode];
if(mode==='onboarding'){document.querySelector('header p').textContent='Setup and library connections.';document.querySelector('.visual').remove();const pair=document.createElement('div');pair.className='setup-pair';pair.innerHTML='<figure><figcaption>Welcome</figcaption><img src="screenshot-onboarding.png" alt="Welcome screen"></figure><figure><figcaption>Connect libraries</figcaption><img src="screenshot-libraries.png" alt="Library connections during setup"></figure>';b.append(pair);document.querySelector('.caption').textContent='Beta 25 · Actual app captures'}
if(mode==='square'){document.querySelector('.visual img').src='mockup-rog-ally.png';document.querySelector('.visual img').alt='ROG Ally illustrative mockup';document.querySelector('.caption').textContent='ROG Ally mockup · Demo library';const l=document.createElement('div');l.className='label';l.textContent='Controller support. Steam launch options. Native keyboard.';l.style.maxWidth='900px';l.style.fontSize='25px';b.append(l)}
if(mode==='wordmark'){document.documentElement.style.background='transparent';document.body.style.background='transparent'}
</script></html>
